# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: true
enable_free_tier: true
focus: high
tone_instructions: "Be direct, precise, and assertive. Prioritize correctness, security, performance, reliability, maintainability, and build/test failures."

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: true

  path_filters:
    - "**"
    - "!**/node_modules/**"
    - "!**/vendor/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/target/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/genproto/**"
    - "!src/frontend/protos/demo.ts"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!**/go.sum"

  path_instructions:
    - path: "**/*.go"
      instructions: "Review for compile errors, context cancellation, goroutine leaks, unchecked errors, nil dereferences, off-by-one loops, telemetry correctness, insecure network configuration, and sensitive data logging."
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: "Review for TypeScript and React build errors, runtime exceptions, unsafe parsing, stale hooks, out-of-bounds access, client-side exposure of sensitive data, inefficient rendering, and broken Next.js API behavior."
    - path: "**/*.cs"
      instructions: "Review for C# build errors, async/await misuse, resource leaks, Redis/cart consistency issues, exception handling problems, and telemetry instrumentation regressions."
    - path: "**/*.rs"
      instructions: "Review for Rust compile errors, async handler failures, panics, unwrap misuse, poor error propagation, and shipping quote correctness."
    - path: "**/*.{yaml,yml}"
      instructions: "Review configuration for invalid schema, insecure defaults, exposed secrets, broken compose wiring, and settings that weaken service isolation."
    - path: "**/Dockerfile"
      instructions: "Review for insecure base image usage, missing non-root user, cache and dependency risks, and broken service build behavior."
    - path: "**/*.md"
      instructions: "Review documentation for accuracy against the OpenTelemetry Demo project. Flag unrelated content, misleading setup instructions, obsolete security guidance, and nginx or SSLv2 content that does not belong."

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: true
    base_branches:
      - ".*"
    ignore_title_keywords: []
    labels: []

  slop_detection:
    enabled: true
    label: slop

  labeling_instructions:
    - label: security
      instructions: "Suggest when changes introduce or touch authentication, authorization, TLS, secrets, PII, payment data, dependency vulnerabilities, or insecure logging."
    - label: performance
      instructions: "Suggest when changes introduce avoidable repeated work, inefficient loops, unbounded concurrency, blocking calls, or excessive allocation."
    - label: bug
      instructions: "Suggest when changes introduce incorrect behavior, crashes, off-by-one errors, out-of-bounds access, nil dereferences, or failed error handling."
    - label: documentation
      instructions: "Suggest when README or docs are changed."
    - label: build
      instructions: "Suggest when changes affect compilation, package manifests, Dockerfiles, generated code, or CI behavior."

  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: error
      requirements: "Title must accurately describe user-visible intent and must not claim obsolete or insecure protocol support unless genuinely implemented."
    description:
      mode: error
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "No sensitive data logging"
        mode: error
        instructions: "Fail if changed code logs, prints, traces, or serializes credit card numbers, CVV values, auth tokens, passwords, API keys, session IDs, or raw PII."
      - name: "No insecure transport downgrade"
        mode: error
        instructions: "Fail if changed code weakens TLS, disables certificate verification, introduces SSLv2 or SSLv3 compatibility, trusts spoofable forwarding headers without validation, or silently falls back to insecure transport."
      - name: "Build-breaking changes"
        mode: error
        instructions: "Fail if changed source has syntax errors, missing imports, type errors, invalid package references, or obvious compile-time failures."
      - name: "Runtime safety"
        mode: error
        instructions: "Fail if changed code introduces out-of-bounds access, off-by-one loops, nil/null dereferences, unhandled promise rejections, panics, or unchecked failed conversions."
      - name: "Resource leaks"
        mode: error
        instructions: "Fail if changed code creates unbounded goroutines, timers, sockets, HTTP bodies, Redis connections, retained request objects, or global caches without cleanup or bounds."
      - name: "Project documentation relevance"
        mode: error
        instructions: "Fail if README or docs are replaced with unrelated content or instructions for a different project, including unrelated nginx or SSLv2 documentation."

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true

  tools:
    ast-grep:
      essential_rules: true
      packages: []
      rule_dirs: []
      util_dirs: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    languagetool:
      enabled: true
      level: picky
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
    biome:
      enabled: true
    hadolint:
      enabled: true
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    tflint:
      enabled: true
    detekt:
      enabled: true
    eslint:
      enabled: true
    flake8:
      enabled: true
    rubocop:
      enabled: true
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    pmd:
      enabled: true
    clang:
      enabled: true
    cppcheck:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    circleci:
      enabled: true
    clippy:
      enabled: true
    sqlfluff:
      enabled: true
    trivy:
      enabled: true
    prismaLint:
      enabled: true
    pylint:
      enabled: true
    oxc:
      enabled: true
    luacheck:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true
    oasdiff:
      enabled: true
    reactDoctor:
      enabled: true
    presidio:
      enabled: true

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/REVIEW.md"
      - "**/AGENTS.md"
      - "**/CONTRIBUTING.md"
  learnings:
    scope: local
    approval_delay: 0
  pull_requests:
    scope: local
  mcp:
    usage: auto
    disabled_servers: []
  automatic_repository_linking: false
  linked_repositories: []

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "**/*.go"
        instructions: "Generate concise Go doc comments only when exported symbols need them."
      - path: "**/*.{ts,tsx}"
        instructions: "Generate concise TSDoc only for exported APIs and complex components."
  unit_tests:
    path_instructions:
      - path: "**/*.go"
        instructions: "Prefer focused table-driven tests for changed behavior."
      - path: "**/*.{ts,tsx}"
        instructions: "Prefer focused tests for changed rendering, API, and error behavior."
      - path: "**/*.cs"
        instructions: "Prefer focused xUnit tests for changed cart service behavior."
      - path: "**/*.rs"
        instructions: "Prefer focused Rust unit tests for changed shipping behavior."

